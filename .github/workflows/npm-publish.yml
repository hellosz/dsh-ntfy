name: Publish to npm

# 打 v* 标签（如 v0.1.0）时通过 npm OIDC Trusted Publishing 自动发布到
# registry.npmjs.org。无需任何 token：id-token: write 让 npm 用 OIDC 认证。
#
# 前置（一次性，npmjs.com）：把本仓库设为 dsh-ntfy 的 trusted publisher。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write   # npm OIDC trusted publishing 必需

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish
        run: npm publish --access public --provenance
