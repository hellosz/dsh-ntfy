name: Publish to GitHub Packages

# 打 v* 标签（如 v0.1.0）时自动发布到 GitHub Packages（npm.pkg.github.com）。
# 使用自动的 GITHUB_TOKEN，无需配置任何 secret。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'

      - name: Publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
