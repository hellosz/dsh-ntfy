name: Publish to npm

# 打 v* 标签（如 v1.0.0）时自动发布到 npm registry。
# 前置：在仓库 Settings → Secrets and variables → Actions 里新增 NPM_TOKEN
#（npm 的 Automation access token，权限选 Read and write）。
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
